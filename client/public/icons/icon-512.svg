  <path d="M256,170 C242,170 216,172 195,178 L195,202 C210,198 234,196 248,196 L248,340 L264,340 L264,196 C278,196 302,198 317,202 L317,178 C296,172 270,170 256,170 Z" fill="url(#redGrad)"/>

